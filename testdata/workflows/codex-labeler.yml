# Roughly the issue labeler from the Codex write-up: any issue starts it,
# anyone may use it and the issue text goes straight into the prompt.
name: Issue Labeler

on:
  issues:
    types: [opened, labeled]

jobs:
  gather-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      codex_output: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5

      - id: codex
        uses: openai/codex-action@main
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          allow-users: "*"
          prompt: |
            You are an assistant that reviews GitHub issues and suggests labels.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

<rect class="l" id="r10_1" x="357.2" y="235" width="42.1" height="17" fill="#d70000"/>
<text id="l10" class="l" x="20" y="248"> gemini-cli           2      6        5 <tspan class="b" style="fill:#ffffff">    2</tspan> <tspan class="b" style="fill:#f38ba8">    3</tspan> <tspan style="fill:#f9e2af">    1</tspan> <tspan class="d">    0</tspan>     77  <tspan style="fill:#f38ba8">menace</tspan></text>
<rect class="l" id="r11_1" x="357.2" y="253" width="42.1" height="17" fill="#d70000"/>
<text id="l11" class="l" x="20" y="266"> openclaw             2      5        4 <tspan class="b" style="fill:#ffffff">    1</tspan> <tspan class="b" style="fill:#f38ba8">    4</tspan> <tspan style="fill:#f9e2af">    1</tspan> <tspan class="d">    0</tspan>     60  <tspan style="fill:#f38ba8">menace</tspan></text>
<text id="l12" class="l" x="20" y="284"> cursor               1      4        3 <tspan class="d">    0</tspan> <tspan class="b" style="fill:#f38ba8">    3</tspan> <tspan style="fill:#f9e2af">    1</tspan> <tspan class="d">    0</tspan>     27  repeat offender</text>
<text id="l13" class="l" x="20" y="302"></text>
<text id="l14" class="l" x="20" y="320"> <tspan class="b">TOP OFFENSES</tspan></text>
<rect class="l" id="r15_1" x="87.4" y="325" width="33.7" height="17" fill="#d70000"/>
<text id="l15" class="l" x="20" y="338">    4x  <tspan class="b" style="fill:#ffffff">CRIT</tspan>  Touched a tattlr canary                    <tspan class="d">claude-code, openclaw</tspan></text>
<rect class="l" id="r16_1" x="87.4" y="343" width="33.7" height="17" fill="#d70000"/>
<text id="l16" class="l" x="20" y="356">    2x  <tspan class="b" style="fill:#ffffff">CRIT</tspan>  Piped a remote script into a shell         <tspan class="d">claude-code, gemini-cli</tspan></text>
<rect class="l" id="r17_1" x="87.4" y="361" width="33.7" height="17" fill="#d70000"/>
<text id="l17" class="l" x="20" y="374">    1x  <tspan class="b" style="fill:#ffffff">CRIT</tspan>  Wrote straight to a disk device            <tspan class="d">gemini-cli</tspan></text>
<rect class="l" id="r18_1" x="87.4" y="379" width="33.7" height="17" fill="#d70000"/>
<text id="l18" class="l" x="20" y="392">    1x  <tspan class="b" style="fill:#ffffff">CRIT</tspan>  Sent secrets over the network              <tspan class="d">codex</tspan></text>
<text id="l19" class="l" x="20" y="410">    8x  <tspan class="b" style="fill:#f38ba8">HIGH</tspan>  Read a secret file                         <tspan class="d">claude-code, cursor, gemini-cli, openclaw</tspan></text>

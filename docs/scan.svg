<text id="l1" class="l" x="20" y="86"></text>
<rect class="l" id="r2_1" x="28.4" y="91" width="67.4" height="17" fill="#d70000"/>
<text id="l2" class="l" x="20" y="104"> <tspan class="b" style="fill:#ffffff"> TATTLR </tspan>  <tspan class="b">RAP SHEET</tspan>  <tspan class="d">11 sessions, 45 tool calls, Aug 3 2025 to Nov 8 2026</tspan></text>
<text id="l3" class="l" x="20" y="122"></text>
<text id="l4" class="l" x="20" y="140"> 32 of 45 tool calls looked sketchy. Most wanted: claude-code (public enemy).</text>
<text id="l5" class="l" x="20" y="158"> The fake keys got read 4 times. Nobody asked for them.</text>
<text id="l6" class="l" x="20" y="176"></text>
<text id="l7" class="l" x="20" y="194"> <tspan class="b">AGENT         SESSIONS  CALLS  FLAGGED  CRIT  HIGH   MED   LOW  SCORE  VERDICT</tspan></text>
<rect class="l" id="r8_1" x="357.2" y="199" width="42.1" height="17" fill="#d70000"/>
<text id="l8" class="l" x="20" y="212"> claude-code          4     21       14 <tspan class="b" style="fill:#ffffff">    4</tspan> <tspan class="b" style="fill:#f38ba8">   10</tspan> <tspan style="fill:#f9e2af">    4</tspan> <tspan class="d">    1</tspan>    193  <tspan class="b" style="fill:#f38ba8">public enemy</tspan></text>
<rect class="l" id="r9_1" x="357.2" y="217" width="42.1" height="17" fill="#d70000"/>

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that can push to kaygaaf/homebrew-tap. Without it the cask is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # npm packages are built here but published by hand, see npm/README.md.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd npm && npm test && node scripts/build-packages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm/out/
